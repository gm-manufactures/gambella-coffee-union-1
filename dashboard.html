<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - የጋምቤላ ማጃንግ የጫካ ቡና አምራችና ላኪ አክሲዬን ማህበር</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
:root {
    --primary-dark: #1a472a;
    --primary: #2d6a1a;
    --primary-light: #4a8c35;
    --primary-gradient: linear-gradient(135deg, #1a472a 0%, #2d6a1a 50%, #3e8e2a 100%);
    --secondary: #d4a017;
    --secondary-light: #f5c542;
    --secondary-gradient: linear-gradient(135deg, #c49a0c 0%, #e6b422 100%);
    --danger: #dc3545;
    --danger-light: #ff4757;
    --warning: #ff9800;
    --success: #28a745;
    --info: #17a2b8;
    --dark: #1a1a2e;
    --gray-dark: #2d3436;
    --gray: #636e72;
    --gray-light: #b2bec3;
    --gray-bg: #f8f9fa;
    --white: #ffffff;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-md: 0 4px 15px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
    --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.2);
    --border-radius-sm: 8px;
    --border-radius-md: 12px;
    --border-radius-lg: 16px;
    --border-radius-xl: 24px;
    --transition-fast: 0.2s ease;
    --transition-normal: 0.3s ease;
    --transition-slow: 0.5s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', 'Segoe UI', 'Inter', sans-serif; background: linear-gradient(145deg, #e8f0e8 0%, #d4e4d4 100%); min-height: 100vh; color: var(--dark); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--gray-light); border-radius: 10px; }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
.navbar { background: var(--primary-gradient); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-lg); position: sticky; top: 0; z-index: 100; }
.logo-area { display: flex; align-items: center; gap: 15px; }
.union-logo-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 3px solid var(--secondary-light); background: white; box-shadow: var(--shadow-sm); transition: var(--transition-fast); }
.union-logo-img:hover { transform: scale(1.05); border-color: white; }
.logo-area div strong { font-size: 1.2rem; letter-spacing: 0.5px; }
.logout-btn { background: rgba(220, 53, 69, 0.95); color: white; border: none; padding: 10px 20px; border-radius: var(--border-radius-md); cursor: pointer; font-weight: 600; transition: var(--transition-fast); backdrop-filter: blur(10px); }
.logout-btn:hover { background: var(--danger); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.container { max-width: 1440px; margin: 24px auto; padding: 0 24px; }
.tabs { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.tab-btn { padding: 12px 28px; background: var(--white); border: none; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.95rem; color: var(--gray-dark); box-shadow: var(--shadow-sm); transition: all var(--transition-fast); position: relative; overflow: hidden; }
.tab-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-gradient); opacity: 0; transition: var(--transition-fast); z-index: -1; }
.tab-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); color: var(--primary); }
.tab-btn.active { background: var(--primary-gradient); color: white; box-shadow: var(--shadow-md); }
.tab-btn.active::before { opacity: 1; }
.tab-content { display: none; background: var(--white); padding: 32px; border-radius: var(--border-radius-xl); box-shadow: var(--shadow-lg); animation: fadeInUp 0.4s ease; }
.tab-content.active { display: block; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.form-section { margin-bottom: 32px; padding: 24px; background: var(--gray-bg); border-radius: var(--border-radius-lg); border: 1px solid rgba(0, 0, 0, 0.05); transition: var(--transition-fast); }
.form-section:hover { box-shadow: var(--shadow-sm); }
.form-section h3 { color: var(--primary); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--primary); font-size: 1.3rem; font-weight: 600; }
.form-section h3::before { content: '🌿 '; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--gray-dark); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: var(--border-radius-md); font-size: 14px; transition: all var(--transition-fast); background: var(--white); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 106, 26, 0.1); }
.btn-primary { background: var(--primary-gradient); color: white; padding: 12px 28px; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; transition: all var(--transition-fast); box-shadow: var(--shadow-sm); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
.stats { display: flex; gap: 12px; align-items: center; background: var(--primary-gradient); padding: 8px 18px; border-radius: 50px; color: white; }
.search-bar { margin-bottom: 24px; }
.search-bar input { width: 100%; padding: 14px 20px; border: 2px solid #e9ecef; border-radius: 50px; font-size: 16px; transition: var(--transition-fast); background: var(--white); }
.search-bar input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 106, 26, 0.1); }
.member-card { border: 1px solid rgba(0, 0, 0, 0.08); padding: 20px; margin-bottom: 16px; border-radius: var(--border-radius-lg); background: var(--white); border-left: 5px solid var(--primary); transition: all var(--transition-normal); position: relative; overflow: hidden; }
.member-card:hover { transform: translateX(8px); box-shadow: var(--shadow-lg); }
.member-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
.member-name { font-size: 1.2em; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.serial-number { background: var(--primary); color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
.member-role { background: var(--primary-gradient); color: white; padding: 6px 14px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; }
.member-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; font-size: 0.85rem; position: relative; z-index: 1; }
.share-badge { background: var(--secondary-gradient); color: var(--dark); padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; }
@media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .navbar { padding: 12px 20px; }
    .tab-btn { padding: 10px 18px; font-size: 0.85rem; }
    .tab-content { padding: 20px; }
    .member-name { font-size: 1rem; }
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo-area">
    <img src="logo.jpg" alt="Logo" class="union-logo-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23f5c542%22/%3E%3Ctext x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23333%22%3E🌿%3C/text%3E%3C/svg%3E';">
    <div><strong>የጋምቤላ ማጃንግ የጫካ ቡና አምራችና ላኪ አክሲዬን ማህበር</strong><br><small>Admin Dashboard</small></div>
  </div>
  <div><span id="userName"></span><button onclick="logout()" class="logout-btn" style="margin-left:15px">🚪 ውጣ</button></div>
</nav>
<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('register', this)">📝 አዲስ አባል ይመዝግቡ</button>
    <button class="tab-btn" onclick="showTab('list', this)">📋 የአባላት ዝርዝር</button>
    <button class="tab-btn" onclick="showTab('sales', this)">💰 ሽያጭ ይመዝግቡ</button>
    <button class="tab-btn" onclick="showTab('transfer', this)">🔄ዝውውር</button>
    <button class="tab-btn" onclick="showTab('trading', this)">📊 የአክሲዬን ግብይት</button>
    <button class="tab-btn" onclick="showTab('search', this)">🔍 አባል ይፈልጉ</button>
    <button class="tab-btn" onclick="showTab('admin', this)">⚙️ አስተዳዳሪ</button>
  </div>

  <!-- Register Tab -->
  <div id="register" class="tab-content active">
    <h2>📝 የአባልነት ምዝገባ ቅፅ</h2>
    <form id="memberForm">
      <div class="form-section">
        <h3>📌 የአባሉ መረጃ</h3>
        <div class="form-row">
          <div class="form-group"><label>ሙሉ ስም *</label><input type="text" id="fullName" required></div>
          <div class="form-group"><label>ፆታ</label><select id="gender"><option>ወንድ</option><option>ሴት</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>ዕድሜ</label><input type="number" id="age"></div>
          <div class="form-group"><label>የእናት ሙሉ ስም</label><input type="text" id="motherName"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>ስልክ ቁጥር</label><input type="tel" id="phone"></div>
          <div class="form-group"><label>የይለፍ ቃል (ለመግቢያ)</label><input type="text" id="password" value="1234"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>የአክሲዬን ብዛት</label><input type="number" id="shareCount" value="0"></div>
          <div class="form-group"><label>በማህበሩ ያለው ኃላፊነት</label><input type="text" id="role" value="አባል"></div>
        </div>
      </div>
      <button type="submit" class="btn-primary">✅ አስመዝግብ</button>
    </form>
  </div>

  <!-- Members List Tab -->
  <div id="list" class="tab-content">
    <div class="list-header"><h2>📋 የአባላት ዝርዝር</h2><div class="stats"><span id="memberCount">0 አባላት</span></div></div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 ፈልግ..." onkeyup="loadMembers()"></div>
    <div id="membersList" class="members-list"></div>
  </div>

  <!-- Sales, Transfer, Trading, Search, Admin Tabs -->
  <div id="sales" class="tab-content"><h2>💰 ሽያጭ</h2><p>በቅርቡ ይመጣል...</p></div>
  <div id="transfer" class="tab-content"><h2>🔄 ዝውውር</h2><p>በቅርቡ ይመጣል...</p></div>
  <div id="trading" class="tab-content"><h2>📊 ግብይት</h2><p>በቅርቡ ይመጣል...</p></div>
  <div id="search" class="tab-content"><h2>🔍 ፍለጋ</h2><p>በቅርቡ ይመጣል...</p></div>
  <div id="admin" class="tab-content"><h2>⚙️ አስተዳዳሪ</h2><p>በቅርቡ ይመጣል...</p></div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/';

let members = [];
let currentUser = JSON.parse(localStorage.getItem('user') || '{}');

function showTab(tabId, element) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  if (element) element.classList.add('active');
  if (tabId === 'list') loadMembers();
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

async function loadMembers() {
  try {
    const res = await fetch('/api/members');
    const data = await res.json();
    members = Array.isArray(data) ? data : (data.members || []);
    const search = document.getElementById('searchInput')?.value || '';
    let filtered = members;
    if (search) {
      filtered = members.filter(m => 
        (m.full_name && m.full_name.toLowerCase().includes(search.toLowerCase())) || 
        (m.phone && m.phone.includes(search))
      );
    }
    document.getElementById('memberCount').innerHTML = filtered.length + ' አባላት';
    const container = document.getElementById('membersList');
    if (!filtered.length) {
      container.innerHTML = '<div class="no-data">📭 ምንም አባላት የሉም</div>';
      return;
    }
    // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
    container.innerHTML = filtered.map((m, index) => `
      <div class="member-card">
        <div class="member-header">
          <div class="member-name">
            <span class="serial-number">#${index + 1}</span>
            <strong>${escapeHtml(m.full_name || 'No Name')}</strong>
            ${m.share_count > 0 ? `<span class="share-badge">📊 ${m.share_count} አክሲዬን</span>` : ''}
          </div>
          <div class="member-role">${escapeHtml(m.role || 'Member')}</div>
        </div>
        <div class="member-details">
          <div>📞 ${escapeHtml(m.phone || 'N/A')}</div>
          <div>🆔 ${escapeHtml(m.member_id || 'N/A')}</div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('membersList').innerHTML = '<div class="no-data">❌ ስህተት ተከስቷል</div>';
  }
}

document.getElementById('memberForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '⏳ እባክዎ ይጠብቁ...';
    submitBtn.disabled = true;

    try {
        const memberData = {
            member_id: 'GMFC' + Math.floor(Math.random() * 10000),
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            gender: document.getElementById('gender').value,
            age: parseInt(document.getElementById('age').value) || 0,
            mother_name: document.getElementById('motherName').value,
            password: document.getElementById('password').value || '1234',
            share_count: parseInt(document.getElementById('shareCount').value) || 0,
            role: document.getElementById('role').value || 'አባል'
        };

        const response = await fetch('/api/members', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(memberData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
            alert(`✅ አባል በሚገባ ተመዝግቧል!\n\n👤 ስም: ${memberData.full_name}\n🆔 መለያ: ${memberData.member_id}`);
            document.getElementById('memberForm').reset();
            await loadMembers();
            showTab('list', document.querySelectorAll('.tab-btn')[1]);
        } else {
            alert('❌ ምዝገባ አልተሳካም: ' + (result.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('❌ Submission error:', error);
        alert('❌ የአገልጋይ ስህተት: ' + error.message);
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

function logout() { localStorage.clear(); window.location.href = '/'; }

// ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
document.getElementById('userName').innerHTML = `👤 ${escapeHtml(currentUser.fullName) || 'Admin'}`;
loadMembers();
</script>
</body>
</html>
