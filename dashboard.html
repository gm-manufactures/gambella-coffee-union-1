<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - የጋምቤላ ማጃንግ የጫካ ቡና</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
    :root {
        --primary-dark: #1a472a; --primary: #2d6a1a; --primary-light: #4a8c35;
        --primary-gradient: linear-gradient(135deg, #1a472a 0%, #2d6a1a 50%, #3e8e2a 100%);
        --secondary: #d4a017; --secondary-light: #f5c542;
        --danger: #dc3545; --success: #28a745; --info: #17a2b8;
        --dark: #1a1a2e; --gray-dark: #2d3436; --gray: #636e72;
        --gray-light: #b2bec3; --gray-bg: #f8f9fa; --white: #ffffff;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.08); --shadow-md: 0 4px 15px rgba(0,0,0,0.1);
        --border-radius-sm: 8px; --border-radius-md: 12px; --border-radius-lg: 16px; --border-radius-xl: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; background: linear-gradient(145deg, #e8f0e8 0%, #d4e4d4 100%); min-height: 100vh; color: var(--dark); }
    .navbar { background: var(--primary-gradient); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-md); position: sticky; top: 0; z-index: 100; }
    .logo-area { display: flex; align-items: center; gap: 15px; }
    .union-logo-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 3px solid var(--secondary-light); background: white; }
    .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: var(--border-radius-md); cursor: pointer; font-weight: 600; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .tabs { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .tab-btn { padding: 12px 28px; background: var(--white); border: none; border-radius: 50px; cursor: pointer; font-weight: 600; color: var(--gray-dark); box-shadow: var(--shadow-sm); transition: 0.2s; }
    .tab-btn.active { background: var(--primary-gradient); color: white; }
    .tab-content { display: none; background: var(--white); padding: 32px; border-radius: var(--border-radius-xl); box-shadow: var(--shadow-sm); }
    .tab-content.active { display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--gray-dark); font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: var(--border-radius-md); font-size: 14px; }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .btn-primary { background: var(--primary-gradient); color: white; padding: 12px 28px; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 10px; }
    .member-card { border: 1px solid #eee; padding: 20px; margin-bottom: 16px; border-radius: var(--border-radius-lg); background: var(--white); border-left: 5px solid var(--primary); box-shadow: var(--shadow-sm); }
    .member-name { font-size: 1.2em; font-weight: bold; color: var(--primary); }
    .member-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; font-size: 0.9rem; }
    .stat-card { background: linear-gradient(135deg, #2d6a1a, #1a4a0e); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    .stat-value { font-size: 2em; font-weight: bold; }
    @media (max-width: 768px) {
        .form-row { grid-template-columns: 1fr; }
        .navbar { padding: 12px 20px; }
        .tab-content { padding: 20px; }
    }
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo-area">
    <img src="logo.jpg" alt="Logo" class="union-logo-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23f5c542%22/%3E%3C/svg%3E';">
    <div><strong>የጋምቤላ ማጃንግ የጫካ ቡና አምራችና ላኪ አክሲዬን ማህበር</strong><br><small>Admin Dashboard</small></div>
  </div>
  <div><span id="userName">Admin</span><button onclick="logout()" class="logout-btn" style="margin-left:15px">🚪 ውጣ</button></div>
</nav>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('register', this)">📝 አዲስ አባል ይመዝግቡ</button>
    <button class="tab-btn" onclick="showTab('list', this)">📋 የአባላት ዝርዝር</button>
  </div>

  <!-- Register Tab -->
  <div id="register" class="tab-content active">
    <h2 style="margin-bottom: 20px; color: var(--primary);">📝 አዲስ አባል መመዝገቢያ</h2>
    <form id="memberForm">
      <div class="form-row">
        <div class="form-group"><label>ሙሉ ስም *</label><input type="text" id="fullName" required></div>
        <div class="form-group"><label>ስልክ ቁጥር *</label><input type="tel" id="phone" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ፆታ</label><select id="gender"><option>ወንድ</option><option>ሴት</option></select></div>
        <div class="form-group"><label>ዕድሜ</label><input type="number" id="age"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>የይለፍ ቃል (ለመግቢያ)</label><input type="text" id="password" value="1234"></div>
        <div class="form-group"><label>የአክሲዮን ብዛት</label><input type="number" id="shareCount" value="0"></div>
      </div>
      <button type="submit" class="btn-primary">✅ አስመዝግብ</button>
    </form>
  </div>

  <!-- Members List Tab -->
  <div id="list" class="tab-content">
    <div class="stat-card">
      <div>👥 ጠቅላላ የተመዘገቡ አባላት</div>
      <div class="stat-value" id="memberCount">0</div>
    </div>
    <div id="membersList">
        <p style="text-align:center; color:#999;">በመጫን ላይ...</p>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
// ✅ ከ '/login.html' ወደ '/' ተቀይሯል
if (!token) window.location.href = '/';

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  if (tabId === 'list') loadMembers();
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

async function loadMembers() {
  try {
    const res = await fetch('/api/members');
    const data = await res.json();
    const members = Array.isArray(data) ? data : (data.members || []);
    
    document.getElementById('memberCount').innerText = members.length;
    
    const container = document.getElementById('membersList');
    if (!members.length) {
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">📭 ምንም አባላት የሉም</div>';
      return;
    }
    
    // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
    container.innerHTML = members.map((m, index) => `
      <div class="member-card">
        <div class="member-name">👤 ${escapeHtml(m.full_name || 'No Name')}</div>
        <div class="member-details">
          <div>📞 ${escapeHtml(m.phone || 'N/A')}</div>
          <div>🆔 ${escapeHtml(m.member_id || 'N/A')}</div>
          <div>📊 አክሲዮን: ${m.share_count || 0}</div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('membersList').innerHTML = '<div style="text-align:center; color:#dc3545;">❌ ስህተት ተከስቷል</div>';
  }
}

document.getElementById('memberForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.innerHTML = '⏳ በመመዝገብ ላይ...';
    submitBtn.disabled = true;
    try {
        const memberData = {
            member_id: 'GMFC' + Math.floor(Math.random() * 10000),
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            gender: document.getElementById('gender').value,
            age: parseInt(document.getElementById('age').value) || 0,
            password: document.getElementById('password').value || '1234',
            share_count: parseInt(document.getElementById('shareCount').value) || 0
        };

        const response = await fetch('/api/members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(memberData)
        });
        
        if (response.ok) {
            // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
            alert(`✅ አባል በሚገባ ተመዝግቧል!\n\n🆔 መለያ: ${memberData.member_id}`);
            document.getElementById('memberForm').reset();
            showTab('list', document.querySelectorAll('.tab-btn')[1]);
        } else {
            const err = await response.json();
            alert('❌ ምዝገባ አልተሳካም: ' + (err.error || 'Unknown error'));
        }
    } catch (error) {
        alert('❌ የአገልጋይ ስህተት: ' + error.message);
    } finally {
        submitBtn.innerHTML = '✅ አስመዝግብ';
        submitBtn.disabled = false;
    }
});

function logout() { localStorage.clear(); window.location.href = '/'; }
</script>
</body>
</html>
