<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - የጋምቤላ ማጃንግ የጫካ ቡና</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
    :root {
        --primary: #2d6a1a; --primary-gradient: linear-gradient(135deg, #1a472a 0%, #2d6a1a 50%, #3e8e2a 100%);
        --danger: #dc3545; --white: #ffffff; --gray-dark: #2d3436; --shadow-sm: 0 2px 8px rgba(0,0,0,0.08); --shadow-md: 0 4px 15px rgba(0,0,0,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #e8f0e8; min-height: 100vh; }
    .navbar { background: var(--primary-gradient); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
    .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; background: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow-sm); }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; background: white; padding: 30px; border-radius: 16px; box-shadow: var(--shadow-md); }
    .tab-content.active { display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    .btn-primary { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
    .member-card { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid var(--primary); background: #fafafa; }
    .member-name { font-size: 18px; font-weight: bold; color: var(--primary); }
    .member-details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 14px; }
    .stat-card { background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-size: 24px; font-weight: bold; }
    @media (max-width: 768px) {
        .form-row { grid-template-columns: 1fr; }
        .member-details { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<nav class="navbar">
  <div><strong>የጋምቤላ ማጃንግ የጫካ ቡና</strong> | Admin Dashboard</div>
  <div><span>Admin</span><button onclick="logout()" class="logout-btn" style="margin-left:15px">🚪 ውጣ</button></div>
</nav>

<div class="container">
  <div class="tabs">
    <button id="btn-register" class="tab-btn active">📝 አዲስ አባል ይመዝገቡ</button>
    <button id="btn-list" class="tab-btn">📋 የአባላት ዝርዝር</button>
  </div>

  <!-- Register Tab -->
  <div id="tab-register" class="tab-content active">
    <h2 style="margin-bottom: 20px; color: var(--primary);">📝 አዲስ አባል መመዝገቢያ</h2>
    <form id="memberForm">
      <div class="form-row">
        <div class="form-group"><label>ሙሉ ስም *</label><input type="text" id="fullName" required></div>
        <div class="form-group"><label>ስልክ ቁጥር *</label><input type="tel" id="phone" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ፆታ</label><select id="gender"><option>ወንድ</option><option>ሴት</option></select></div>
        <div class="form-group"><label>ዕድሜ</label><input type="number" id="age"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>የይለፍ ቃል (ለመግቢያ)</label><input type="text" id="password" value="1234"></div>
        <div class="form-group"><label>የአክሲዮን ብዛት</label><input type="number" id="shareCount" value="0"></div>
      </div>
      <button type="submit" class="btn-primary">✅ አስመዝግብ</button>
    </form>
  </div>

  <!-- Members List Tab -->
  <div id="tab-list" class="tab-content">
    <div class="stat-card">
      <div style="font-size: 14px; font-weight: normal; margin-bottom: 5px;">👥 ጠቅላላ የተመዘገቡ አባላት</div>
      <div id="memberCount">0</div>
    </div>
    <div id="membersList">
        <p style="text-align:center; color:#999;">በመጫን ላይ...</p>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
// ✅ ከ '/login.html' ወደ '/' ተቀይሯል
if (!token) window.location.href = '/';

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// ✅ አዲሱ የታብ መቀየሪያ ኮድ
function switchTab(tabName) {
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('tab-list').classList.remove('active');
    document.getElementById('btn-register').classList.remove('active');
    document.getElementById('btn-list').classList.remove('active');

    if (tabName === 'register') {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('btn-register').classList.add('active');
    } else {
        document.getElementById('tab-list').classList.add('active');
        document.getElementById('btn-list').classList.add('active');
        loadMembers();
    }
}

document.getElementById('btn-register').addEventListener('click', () => switchTab('register'));
document.getElementById('btn-list').addEventListener('click', () => switchTab('list'));

async function loadMembers() {
  const container = document.getElementById('membersList');
  container.innerHTML = '<p style="text-align:center; color:#999;">በመጫን ላይ...</p>';
  
  try {
    const res = await fetch('/api/members');
    const data = await res.json();
    const members = Array.isArray(data) ? data : (data.members || []);
    
    document.getElementById('memberCount').innerText = members.length;
    
    if (!members.length) {
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">📭 ምንም አባላት የሉም</div>';
      return;
    }
    
    // ✅ የጎደሉ የቦሊያን ኦፕሬተሮች (||) እና የባክቲክ ምልክቶች (`) ተጨምረዋል
    container.innerHTML = members.map(m => {
      const name = m.full_name || m.fullName || 'No Name';
      const id = m.member_id || m.memberId || 'N/A';
      const phone = m.phone || 'N/A';
      const shares = m.share_count || m.shareCount || 0;

      return `
      <div class="member-card">
        <div class="member-name">👤 ${escapeHtml(name)}</div>
        <div class="member-details">
          <div>📞 ${escapeHtml(phone)}</div>
          <div>🆔 ${escapeHtml(id)}</div>
          <div>📊 አክሲዮን: ${shares}</div>
        </div>
      </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div style="text-align:center; color:#dc3545;">❌ ስህተት ተከስቷል</div>';
  }
}

document.getElementById('memberForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.innerHTML = '⏳ በመመዝገብ ላይ...';
    submitBtn.disabled = true;

    try {
        const memberData = {
            member_id: 'GMFC' + Math.floor(Math.random() * 10000),
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            gender: document.getElementById('gender').value,
            age: parseInt(document.getElementById('age').value) || 0,
            password: document.getElementById('password').value || '1234',
            share_count: parseInt(document.getElementById('shareCount').value) || 0
        };

        const response = await fetch('/api/members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(memberData)
        });
        
        if (response.ok) {
            // ✅ የጎደለው የባክቲክ ምልክት (`) ተጨምሯል
            alert(`✅ አባል በሚገባ ተመዝግቧል!\n\n🆔 መለያ: ${memberData.member_id}`);
            document.getElementById('memberForm').reset();
            switchTab('list');
        } else {
            const err = await response.json();
            alert('❌ ምዝገባ አልተሳካም: ' + (err.error || 'Unknown error'));
        }
    } catch (error) {
        alert('❌ የአገልጋይ ስህተት: ' + error.message);
    } finally {
        submitBtn.innerHTML = '✅ አስመዝግብ';
        submitBtn.disabled = false;
    }
});

// ✅ ከ '/login.html' ወደ '/' ተቀይሯል
function logout() { localStorage.clear(); window.location.href = '/'; }
</script>
</body>
</html>
